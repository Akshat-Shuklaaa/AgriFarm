version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - REDIS_URL=redis://redis-db:6379
      - CORS_ORIGINS=http://localhost:3000
      - JWT_SECRET=dev-secret-change-in-production
    depends_on:
      redis-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  redis-db:
    image: redis:latest
    ports:
      - "6380:6379"  # Use 6380 on host to avoid conflict with existing redis container on 6379
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --save 60 1 --save 300 100
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
